[package]
name = "oxistore-blob-s3-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Detach from the parent `oxistore` workspace — see the sibling comment in
# oxistore-encrypt/fuzz/Cargo.toml for why.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxistore-blob-s3]
path = ".."

[[bin]]
name = "s3_error_xml"
path = "fuzz_targets/s3_error_xml.rs"
test = false
doc = false
bench = false
